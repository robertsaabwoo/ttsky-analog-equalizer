<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="545" viewBox="0 0 1000 545" role="img"><title>CTLE + CDR receiver signal path</title><desc>Block diagram of the analog receiver front end</desc><rect x="0" y="0" width="1000" height="545" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="28" y="34" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1b1f24" text-anchor="start">600 Mb/s analog receiver front end</text><text x="28" y="55" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">The channel is the chip's own analog pin. There is no reference clock anywhere on the die — the output clock is recovered from the data.</text><text x="26" y="116" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#1b1f24" text-anchor="start">ua[0]</text><text x="26" y="134" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#1b1f24" text-anchor="start">ua[1]</text><text x="26" y="152" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">ua[2]</text><text x="26" y="168" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#57606a" text-anchor="start">vbias</text><line x1="76" y1="112" x2="89.3" y2="116" stroke="#6e7781" stroke-width="1.8" stroke-linecap="round"/><polygon points="96.0,118.0 89.1,118.9 90.7,113.4" fill="#6e7781"/><line x1="76" y1="130" x2="89" y2="128.7" stroke="#6e7781" stroke-width="1.8" stroke-linecap="round"/><polygon points="96.0,128.0 89.9,131.5 89.4,125.8" fill="#6e7781"/><rect x="96" y="92" width="148" height="66" rx="7" fill="#f6f8fa" stroke="#c0392b" stroke-width="1.6"/><rect x="96" y="92" width="4" height="66" rx="2" fill="#c0392b"/><text x="170" y="113" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1b1f24" text-anchor="middle">analog pin path</text><text x="170" y="131" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="middle">500 Ω / 5 pF (TT spec bound)</text><text x="170" y="145" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="middle">pole 63.7 MHz · −13.7 dB @ Nyquist</text><line x1="244" y1="125" x2="281" y2="125" stroke="#6e7781" stroke-width="1.8" stroke-linecap="round"/><polygon points="288.0,125.0 281.6,127.9 281.6,122.1" fill="#6e7781"/><text x="266" y="113" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#c0392b" text-anchor="middle">64 mV</text><text x="266" y="151" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#c0392b" text-anchor="middle">eye shut</text><rect x="288" y="92" width="138" height="66" rx="7" fill="#f6f8fa" stroke="#1f6feb" stroke-width="1.6"/><rect x="288" y="92" width="4" height="66" rx="2" fill="#1f6feb"/><text x="357" y="113" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1b1f24" text-anchor="middle">CTLE</text><text x="357" y="131" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="middle">degenerated diff pair</text><text x="357" y="145" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="middle">+13.3 dB @ Nyquist</text><line x1="426" y1="125" x2="463" y2="125" stroke="#6e7781" stroke-width="1.8" stroke-linecap="round"/><polygon points="470.0,125.0 463.6,127.9 463.6,122.1" fill="#6e7781"/><text x="448" y="113" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1f6feb" text-anchor="middle">299 mV</text><text x="448" y="151" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#1f6feb" text-anchor="middle">eye open</text><rect x="470" y="92" width="148" height="66" rx="7" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.6"/><rect x="470" y="92" width="4" height="66" rx="2" fill="#1a7f37"/><text x="544" y="113" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1b1f24" text-anchor="middle">CDR</text><text x="544" y="131" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="middle">bang-bang, reference-less</text><text x="544" y="145" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="middle">locks at 600.64 MHz</text><line x1="618" y1="125" x2="655" y2="125" stroke="#6e7781" stroke-width="1.8" stroke-linecap="round"/><polygon points="662.0,125.0 655.6,127.9 655.6,122.1" fill="#6e7781"/><rect x="662" y="92" width="128" height="66" rx="7" fill="#f6f8fa" stroke="#6e7781" stroke-width="1.6"/><rect x="662" y="92" width="4" height="66" rx="2" fill="#6e7781"/><text x="726" y="113" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1b1f24" text-anchor="middle">output buffers</text><text x="726" y="131" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="middle">2 × tapered</text><text x="726" y="145" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="middle">inverter chain</text><line x1="790" y1="116" x2="815" y2="116" stroke="#6e7781" stroke-width="1.8" stroke-linecap="round"/><polygon points="822.0,116.0 815.6,118.9 815.6,113.1" fill="#6e7781"/><line x1="790" y1="136" x2="815" y2="136" stroke="#6e7781" stroke-width="1.8" stroke-linecap="round"/><polygon points="822.0,136.0 815.6,138.9 815.6,133.1" fill="#6e7781"/><text x="828" y="114" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#1b1f24" text-anchor="start">uo[0]</text><text x="872" y="114" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="start">recovered clock</text><text x="828" y="134" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#1b1f24" text-anchor="start">uo[1]</text><text x="872" y="134" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="start">inverted phase</text><text x="828" y="152" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#57606a" text-anchor="start">600.64 MHz, full rate</text><line x1="72" y1="148" x2="72" y2="190" stroke="#8250df" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="4 3"/><line x1="72" y1="190" x2="357" y2="190" stroke="#8250df" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="4 3"/><line x1="357" y1="190" x2="357" y2="167" stroke="#8250df" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 3"/><polygon points="357.0,160.0 359.9,166.4 354.1,166.4" fill="#8250df"/><rect x="26" y="216" width="948" height="250" rx="8" fill="#fbfcfd" stroke="#c8d1da" stroke-width="1.2"/><text x="42" y="240" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1b1f24" text-anchor="start">inside the CDR</text><text x="150" y="240" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="start">— the phase detector reports only early/late, never frequency, and everything awkward about the loop follows from that</text><rect x="112" y="260" width="190" height="64" rx="7" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6"/><rect x="112" y="260" width="4" height="64" rx="2" fill="#1a7f37"/><text x="207" y="281" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1b1f24" text-anchor="middle">Alexander phase detector</text><text x="207" y="299" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="middle">4 × D flip-flop + 2 × XOR</text><text x="207" y="313" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="middle">samples on both clock edges</text><rect x="346" y="260" width="142" height="64" rx="7" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6"/><rect x="346" y="260" width="4" height="64" rx="2" fill="#1a7f37"/><text x="417" y="281" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1b1f24" text-anchor="middle">charge pump</text><text x="417" y="299" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="middle">1.26 µA up / 1.28 µA dn</text><text x="417" y="313" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="middle">1.6 % mismatch, measured</text><rect x="524" y="260" width="142" height="64" rx="7" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6"/><rect x="524" y="260" width="4" height="64" rx="2" fill="#1a7f37"/><text x="595" y="281" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1b1f24" text-anchor="middle">loop filter</text><text x="595" y="299" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="middle">~10× smaller than the</text><text x="595" y="313" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="middle">PLL it came from</text><rect x="702" y="260" width="168" height="64" rx="7" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6"/><rect x="702" y="260" width="4" height="64" rx="2" fill="#1a7f37"/><text x="786" y="281" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1b1f24" text-anchor="middle">5-stage ring VCO</text><text x="786" y="299" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="middle">differential</text><text x="786" y="313" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="middle">514–621 MHz at tt / 27 °C</text><line x1="302" y1="292" x2="339" y2="292" stroke="#6e7781" stroke-width="1.8" stroke-linecap="round"/><polygon points="346.0,292.0 339.6,294.9 339.6,289.1" fill="#6e7781"/><text x="324" y="283" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#57606a" text-anchor="middle">up / dn</text><line x1="488" y1="292" x2="517" y2="292" stroke="#6e7781" stroke-width="1.8" stroke-linecap="round"/><polygon points="524.0,292.0 517.6,294.9 517.6,289.1" fill="#6e7781"/><line x1="666" y1="292" x2="695" y2="292" stroke="#6e7781" stroke-width="1.8" stroke-linecap="round"/><polygon points="702.0,292.0 695.6,294.9 695.6,289.1" fill="#6e7781"/><text x="684" y="283" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#1b1f24" text-anchor="middle">vctrl</text><text x="684" y="312" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#57606a" text-anchor="middle">0.791 V</text><line x1="88" y1="292" x2="105" y2="292" stroke="#1f6feb" stroke-width="1.8" stroke-linecap="round"/><polygon points="112.0,292.0 105.6,294.9 105.6,289.1" fill="#1f6feb"/><text x="60" y="286" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#1f6feb" text-anchor="middle">equalized</text><text x="60" y="300" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#1f6feb" text-anchor="middle">data</text><line x1="870" y1="292" x2="893" y2="292" stroke="#6e7781" stroke-width="1.8" stroke-linecap="round"/><polygon points="900.0,292.0 893.6,294.9 893.6,289.1" fill="#6e7781"/><text x="936" y="296" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#57606a" text-anchor="middle">to buffers</text><rect x="613" y="342" width="142" height="52" rx="7" fill="#ffffff" stroke="#8250df" stroke-width="1.6"/><rect x="613" y="342" width="4" height="52" rx="2" fill="#8250df"/><text x="684" y="363" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1b1f24" text-anchor="middle">startup precharge</text><text x="684" y="381" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="middle">seeds vctrl ~130 ns,</text><text x="684" y="395" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="middle">then removes itself</text><line x1="684" y1="342" x2="684" y2="333" stroke="#8250df" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 3"/><polygon points="684.0,326.0 686.9,332.4 681.1,332.4" fill="#8250df"/><text x="684" y="408" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#8250df" text-anchor="middle">45/45 PVT corners, cold start</text><line x1="786" y1="324" x2="786" y2="432" stroke="#6e7781" stroke-width="1.8" stroke-linecap="butt"/><line x1="786" y1="432" x2="207" y2="432" stroke="#6e7781" stroke-width="1.8" stroke-linecap="butt"/><line x1="207" y1="432" x2="207" y2="333" stroke="#6e7781" stroke-width="1.8" stroke-linecap="round"/><polygon points="207.0,326.0 209.9,332.4 204.1,332.4" fill="#6e7781"/><text x="497" y="424" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6e7781" text-anchor="middle">the recovered clock is the sampling clock</text><text x="28" y="529" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#57606a" text-anchor="start">measured values: §C16 (channel) · §C18/§C20 (CTLE) · §C23 (end-to-end lock) · §C25-E (charge pump) · §20a/§20b (precharge, VCO) — see docs/DESIGN.md</text></svg>
